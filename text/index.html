<script>
/* =====================================================================

/* ---------- 2. 翻页浏览逻辑 ---------- */
let currentPage = 1;                  /* 当前页号（从 1 开始） */
const totalPage = textPages.length;   /* 总页数 = 数组里有多少段文字 */

/* 取页面上的相关元素 */
const textContainer = document.getElementById('textContainer');  /* 文字卡片 */
const prevBtn = document.getElementById('prevPage');             /* 上一页按钮 */
const nextBtn = document.getElementById('nextPage');             /* 下一页按钮 */
const pageInfo = document.getElementById('pageInfo');            /* 页码文字 */

/* 渲染当前页：把第 currentPage 段文字写进卡片、更新页码文字、
   第一页禁用"上一页"、最后一页禁用"下一页" */
function renderText(){
  textContainer.innerText = textPages[currentPage - 1];
  pageInfo.textContent = `第${currentPage}页 / 共${totalPage}页`;
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= totalPage;
}


/* 上一页：页号减 1 并重新渲染（在第一页时不响应） */
prevBtn.onclick = ()=>{
  if(currentPage > 1){
    currentPage--;
    renderText();
  }
}

/* 下一页：页号加 1 并重新渲染（在最后一页时不响应） */
nextBtn.onclick = ()=>{
  if(currentPage < totalPage){
    currentPage++;
    renderText();
  }
}


/* 页面加载完成立即显示第 1 页 */
renderText();


/* ---------- 3. "更多"全屏下拉菜单（与主页逻辑一致） ---------- */
const moreToggle = document.getElementById('moreToggle');
const fullDropdown = document.getElementById('fullDropdown');
const leftItems = document.querySelectorAll('.full-dropdown-item');
const dropdownRight = document.getElementById('dropdownRight');

/* 菜单数据：key 与 data-id 对应，title/desc/link 分别对应右栏
   标题、说明文字、"前往查看"按钮的跳转地址 */
const menuData = {
  mod: {
    title: "MC联机",
    desc: "简简单单的服务器，没啥亮眼。",
    link: "https://mc.kurlet.com"
  },
  launcher: {
    title: "泰拉瑞亚联机",
    desc: "还没开始做，目前只有MC联机。",
    link: "https://kurlet.com"
  },
  guide: {
    title: "星露谷联机",
    desc: "其实你完全可以走steam联机的对吧。",
    link: "https://kurlet.com"
  },
  faq: {
    title: "饥荒联机",
    desc: "还没搞，其实steam联机也不是不行。",
    link: "https://kurlet.com"
  },
  community: {
    title: "待开发",
    desc: "没准有个大的。",
    link: "https://kurlet.com"
  }
};

/* 根据菜单编号刷新右栏内容，并同步左侧高亮 */
function updatePanel(id) {
  const data = menuData[id];
  dropdownRight.innerHTML = `
    <h3 class="full-dropdown-title">${data.title}</h3>
    <p class="full-dropdown-desc">${data.desc}</p>
    <a class="full-dropdown-link" href="${data.link}" target="_blank">前往查看</a>
  `;
  leftItems.forEach(item => item.classList.remove('active'));
  document.querySelector(`.full-dropdown-item[data-id="${id}"]`).classList.add('active');
}

/* 点"更多"展开/收起菜单 */
function toggleDropdown() {
  fullDropdown.classList.toggle('open');
}
moreToggle.addEventListener('click', toggleDropdown);

/* 点左栏菜单项 → 更新右栏 */
leftItems.forEach(item => {
  item.addEventListener('click', () => {
    updatePanel(item.dataset.id);
  });
});

/* 按 Esc 收起菜单 */
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') {
    fullDropdown.classList.remove('open');
  }
});

/* 点击菜单之外的区域收起菜单 */
document.addEventListener('click', (e) => {
  if (!fullDropdown.contains(e.target) && e.target !== moreToggle) {
    fullDropdown.classList.remove('open');
  }
});
</script>
</body>
</html>
